[project]
name = "tagtrace"
version = "0.1.0"
description = "Compare two pulldeps.json files, collect the Git and Jira changes between them, and assess the release with AI."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.16",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.4"]
openai = ["openai>=2.0"]
browser = ["playwright>=1.50"]

[project.scripts]
tagtrace = "tagtrace.cli:app"

[dependency-groups]
dev = [
    "tagtrace[anthropic,openai,browser]",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tagtrace"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "S603", # git runs with an argument list, never through a shell
    "S607", # git is found on PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
